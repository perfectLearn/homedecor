<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Account | Perfect Home</title><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">Free delivery on orders above ₹999 <span>Easy 7-day returns</span><span>Secure payments</span></div><header class="header"><a class="logo" href="index.html">Perfect<span>Home</span></a><div class="search"><input id="searchInput" placeholder="Search furniture..."><button onclick="performSearch()">🔍</button></div><nav><a href="products.html">Shop</a><a href="account.html">Account</a><a class="cart-link" href="cart.html">🛒 <b id="cartCount">0</b></a></nav></header><main class="account-page"><div class="auth-card"><div class="auth-brand"><span>PH</span><div><b>Perfect Home</b><small>Welcome to your account</small></div></div><div class="tabs"><button id="loginTab" class="active" onclick="showAuth('login')">Sign in</button><button id="signupTab" onclick="showAuth('signup')">Create account</button></div><div id="authMessage"></div><form id="loginForm" onsubmit="login(event)"><label>Email address<input id="loginEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="loginPassword" type="password" minlength="6" required placeholder="Enter your password"></label><button class="btn primary full">Sign in</button><p class="switch">New to Perfect Home? <a onclick="showAuth('signup')">Create an account</a></p></form><form id="signupForm" class="hidden" onsubmit="signup(event)"><label>Full name<input id="signupName" required placeholder="Your full name"></label><label>Email address<input id="signupEmail" type="email" required placeholder="you@example.com"></label><label>Mobile number<input id="signupPhone" pattern="[0-9]{10}" required placeholder="10-digit mobile number"></label><label>Password<input id="signupPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label><label>Confirm password<input id="signupConfirm" type="password" minlength="6" required placeholder="Re-enter password"></label><button class="btn primary full">Create account</button><p class="switch">Already have an account? <a onclick="showAuth('login')">Sign in</a></p></form><div id="accountPanel" class="hidden"></div></div></main><footer><div><a class="logo" href="index.html">Perfect<span>Home</span></a><p>Furniture for modern Indian homes.</p></div><div><b>Shop</b><a href="products.html">All furniture</a></div><div><b>Customer care</b><a href="cart.html">Cart</a></div></footer><script src="js/products.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
